[project]
name = "nbconvert-danielfrg-com"
version = "1.0.0"
description = "Converts the blog notebooks to HTML with mkdocs-jupyter"
authors = [{ name = "Daniel Rodriguez", email = "daniel@danielfrg.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fire>=0.5.0", "mkdocs-jupyter==0.24.3", "pyyaml>=6.0.1"]

[dependency-groups]
dev = ["ruff>=0.17.3", "ty>=0.0.97"]

[tool.uv]
package = false
